name: Daily LinkedIn Automation

# Daily schedule for LinkedIn automation
on:
  schedule:
    # Analysis phase: 15:00 UTC (16:00 Ireland time)
    - cron: '0 15 * * *'
    # Posting phase: 15:30 UTC (16:30 Ireland time) 
    - cron: '30 15 * * *'
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Automation mode'
        required: true
        default: 'analyze'
        type: choice
        options:
          - analyze
          - post
          - test

# Prevent multiple runs
concurrency:
  group: daily-linkedin-automation
  cancel-in-progress: true

jobs:
  analyze-news:
    if: github.event.schedule == '0 15 * * *' || github.event.inputs.mode == 'analyze' || github.event.inputs.mode == 'test'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🧠 Analyze daily news with AI
        env:
          # Google Gemini API
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Supabase Database
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # Telegram Bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Site Configuration
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          
          # GitHub Context for error reporting
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "🚀 Starting daily news analysis..."
          echo "📅 Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🌍 Timezone: UTC"
          echo "🧠 AI Engine: Google Gemini 2.0 Flash"
          echo "📊 Max articles per day: 5"
          echo "🎯 Minimum AI score: 70"
          echo "📤 Telegram notifications: Enabled"
          
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            echo "🧪 Running in TEST mode"
            node scripts/daily-linkedin-automation.js test
          else
            echo "📊 Running ANALYSIS mode"
            node scripts/daily-linkedin-automation.js analyze
          fi
      
      - name: ✅ Analysis success summary
        if: success()
        run: |
          echo "🎉 Daily news analysis completed successfully!"
          echo "📊 Articles analyzed and scored with Google Gemini AI"
          echo "📤 Approval request sent to Telegram"
          echo "⏰ Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "⏳ Next phase: Posting at 15:30 UTC (if approved)"
          echo "📱 Check Telegram for approval buttons"
      
      - name: 📧 Analysis failure notification
        if: failure()
        run: |
          echo "❌ Daily news analysis failed!"
          echo "🔍 Check the logs for details"
          echo "📧 Error notification sent to Telegram"
          echo "🔗 Log URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  post-to-linkedin:
    if: github.event.schedule == '30 15 * * *' || github.event.inputs.mode == 'post'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 📤 Post approved content to LinkedIn
        env:
          # LinkedIn API
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          
          # Supabase Database
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # Telegram Bot
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # Site Configuration
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          
          # GitHub Context for error reporting
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          echo "📤 Starting LinkedIn posting..."
          echo "📅 Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🌍 Timezone: UTC"
          echo "🔗 LinkedIn API: Enabled"
          echo "📊 Processing approved posts only"
          echo "⏱️ Rate limiting: 5 seconds between posts"
          
          node scripts/daily-linkedin-automation.js post
      
      - name: ✅ Posting success summary
        if: success()
        run: |
          echo "🎉 LinkedIn posting completed successfully!"
          echo "📊 Approved articles posted to LinkedIn"
          echo "🔗 Posts automatically converted to lnkd.in format"
          echo "⏰ Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "📈 Engagement tracking will be available in LinkedIn analytics"
          echo "📱 Summary report sent to Telegram"
      
      - name: 📧 Posting failure notification
        if: failure()
        run: |
          echo "❌ LinkedIn posting failed!"
          echo "🔍 Check the logs for details"
          echo "📧 Error notification sent to Telegram"
          echo "🔄 Failed posts will be retried in next cycle"
          echo "🔗 Log URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Health check job (runs once per day)
  system-health-check:
    if: github.event.schedule == '0 15 * * *'
    runs-on: ubuntu-latest
    needs: analyze-news
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏥 System health check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🏥 Running system health check..."
          
          # Test Supabase connection
          node -e "
            import { createClient } from '@supabase/supabase-js';
            const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
            supabase.from('tech_news_articles').select('count').limit(1).then(({error}) => {
              if (error) throw error;
              console.log('✅ Supabase connection: OK');
            }).catch(err => {
              console.log('❌ Supabase connection: FAILED');
              process.exit(1);
            });
          "
          
          # Test Gemini API
          curl -s -f "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "X-goog-api-key: ${{ secrets.GEMINI_API_KEY }}" \
            -X POST \
            -d '{"contents":[{"parts":[{"text":"test"}]}]}' > /dev/null && \
            echo "✅ Google Gemini API: OK" || \
            echo "❌ Google Gemini API: FAILED"
          
          # Test Telegram Bot
          curl -s -f "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/getMe" > /dev/null && \
            echo "✅ Telegram Bot: OK" || \
            echo "❌ Telegram Bot: FAILED"
          
          echo "🏥 Health check completed"
