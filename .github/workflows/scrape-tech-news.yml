name: Scrape Tech News

# Smart scheduling algorithm
# WEEKDAYS ONLY: Nuvemmag doesn't publish on weekends
# Runs 3 times per day: Morning, Afternoon, Evening (UTC)
on:
  schedule:
    # Monday-Friday only
    - cron: '0 8 * * 1-5'   # 08:00 UTC (Morning check)
    - cron: '0 14 * * 1-5'  # 14:00 UTC (Afternoon check)
    - cron: '0 20 * * 1-5'  # 20:00 UTC (Evening check)
  
  # Manual trigger
  workflow_dispatch:

# Prevent multiple runs
concurrency:
  group: tech-news-scraper
  cancel-in-progress: true

jobs:
  scrape-and-translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Scrape and translate tech news
        env:
          # GitHub Secrets - These will be available at runtime
          # IDE warnings are normal - secrets are not accessible locally
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🚀 Starting multi-category tech news scraper..."
          echo "📂 Categories: 7 (AI, Tech, Science, etc.)"
          echo "📊 Articles per category: 15 (Get all daily news)"
          echo "📅 Run time: $(date)"
          echo "🌍 Timezone: UTC"
          echo "📰 Filtering: Recent articles (last 7 days)"
          echo "💾 Storage: Supabase PostgreSQL"
          npm run scrape:news
      
      - name: ✅ Success summary
        if: success()
        run: |
          echo "🎉 Tech news successfully scraped and saved to Supabase!"
          echo "📊 Articles saved directly to PostgreSQL database"
          echo "⏰ Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "💾 Storage: Supabase (no git commit needed)"
          echo "🔄 Website will fetch latest data from database automatically"
      
      - name: 📧 Send notification on failure
        if: failure()
        run: |
          echo "❌ Scraping failed!"
          echo "Check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

