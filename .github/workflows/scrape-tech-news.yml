name: Scrape Tech News

# ============================================================================
# TECH NEWS SCRAPER - MULTI-CATEGORY AI-POWERED WORKFLOW
# ============================================================================
# 
# Bu workflow NuvemMag'dan (Türkçe) haber çeker, İngilizce'ye çevirir ve
# Supabase PostgreSQL veritabanına kaydeder.
#
# ============================================================================
# ÖĞRENILEN DERSLER & KALİTE KONTROL MEKANİZMALARI
# ============================================================================
#
# 1. TARİH VALİDASYONU:
#    - Yıl 2020-{current_year} arasında olmalı
#    - Gelecek tarihler kabul edilmez (1 gün tolerans)
#    - Geçersiz tarihler → bugünün tarihi kullanılır
#
# 2. ÇEVİRİ KALİTE KONTROL:
#    - Türkçe karakter kontrolü (ğüşıöçĞÜŞİÖÇ)
#    - CJK karakter kontrolü (Çince/Japonca/Korece)
#    - Non-Latin karakter kontrolü (Arapça/İbranice/Kiril)
#    - Latin oranı kontrolü (>%80 İngilizce olmalı)
#    - Retry mekanizması (her model için 2 deneme)
#
# 3. INSTRUCTION LEAKAGE TESPİTİ:
#    - "Return the enhanced article" → ❌ Reddet
#    - "Here is the translation" → ❌ Reddet
#    - "Note: I have" → ❌ Reddet
#    - "Your task:" → ❌ Reddet
#    - "TL;DR and key highlights" → ❌ Reddet
#
# 4. EMBED TOKEN SİSTEMİ:
#    - YouTube: [[EMBED:YOUTUBE:VIDEO_ID]]
#    - Twitter: [[EMBED:TWEET:TWEET_ID]]
#    - TikTok: [[EMBED:TIKTOK:URL]]
#    - Token'lar çeviri sırasında __WIDGET_N__ placeholder'larıyla korunur
#    - Çeviri sonrası validateTokenPreservation() ile doğrulanır
#    - Kayıp token'lar otomatik olarak yeniden eklenir
#    - Inline URL'ler de yakalanır (sadece satır başı değil)
#
# 5. YOUTUBE GARBAGE TEXT TEMİZLİK:
#    - Pattern-based skip (sabit 15 satır yerine akıllı algılama)
#    - Gerçek içerik: >80 karakter, noktalama, başlık → KORU
#    - Kısa/belirsiz satırlar: kanal adı, abone sayısı → SİL
#    - "If playback doesn't begin" → ✂️ Sil
#    - "retrieving sharing information" → ✂️ Sil
#    - "0:00 / 1:00" → ✂️ Sil
#
# 6. TWITTER GARBAGE TEXT TEMİZLİK:
#    - "Twitter Widget Iframe" → ✂️ Sil
#    - "Log in" (kısa) → ✂️ Sil
#    - "View on Twitter" → ✂️ Sil
#
# 7. NUVEMMAG BRANDING TEMİZLİK:
#    - "– NuvemMag" başlıktan → ✂️ Sil
#    - nuvemmag.com URL'leri → ✂️ Sil
#    - Logo ve navigasyon → ✂️ Sil
#
# 8. DUPLICATE TESPİTİ:
#    - Slug-based (URL slug'ından çıkarılır)
#    - Same-run tracking (aynı URL 2 kategoride varsa)
#    - source_url unique constraint
#
# 9. AI MODELLERİ (SADECE PRODUCTION - STABİL):
#    - Primary: llama-3.1-8b-instant (560 T/s, 250K TPM)
#    - Fallback: openai/gpt-oss-20b (1000 T/s, 250K TPM)
#    - Last Resort: llama-3.3-70b-versatile (280 T/s, 300K TPM)
#    NOT: Preview modelleri (llama-4-scout, qwen3) kullanılmıyor!
#
# 10. RATE LIMITING:
#     - Groq: 1000ms delay between requests
#     - Firecrawl: 10000ms (10s) delay between articles
#     - Firecrawl waitFor: 4500ms (embed JS rendering time)
#     - Retry with simplified prompt on failure
#
# ============================================================================
# SCHEDULING (Hafta içi, Türkiye saatine göre)
# ============================================================================
#
# TIMEZONE NOTE: Nuvemmag is a Turkish news site (Europe/Istanbul timezone)
# The script automatically handles timezone using JavaScript Intl API,
# including any DST (Daylight Saving Time) changes - no manual updates needed!
#
# Schedule is in UTC (GitHub Actions standard):
# - Morning, afternoon, and evening checks to catch articles throughout the day
# - 10:00 Turkey (07:00 UTC), 16:00 Turkey (13:00 UTC), 18:00 Turkey (15:00 UTC)

on:
  schedule:
    # Monday-Friday only - Three daily checks
    - cron: '0 7 * * 1-5'    # 07:00 UTC = 10:00 Turkey - Morning check
    - cron: '0 13 * * 1-5'   # 13:00 UTC = 16:00 Turkey - Afternoon check
    - cron: '0 15 * * 1-5'   # 15:00 UTC = 18:00 Turkey - Evening check
  
  # Manual trigger
  workflow_dispatch:

# Prevent multiple runs
concurrency:
  group: tech-news-scraper
  cancel-in-progress: true

jobs:
  scrape-and-translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Scrape and translate tech news
        env:
          # GitHub Secrets - These will be available at runtime
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_PARSER_API_KEY: ${{ secrets.GROQ_PARSER_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          TZ: UTC
        run: |
          echo "🚀 Starting multi-category tech news scraper..."
          echo "📂 Categories: 7 (AI, Tech, Science, etc.)"
          echo "📊 Articles per category: 20 (MAX_ARTICLES_PER_CATEGORY)"
          echo "📊 Max articles per run: 50 (safety limit)"
          echo ""
          echo "📅 Time Info:"
          echo "   UTC now: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "   Turkey now: $(TZ='Europe/Istanbul' date +'%Y-%m-%d %H:%M:%S %Z')"
          echo ""
          echo "🌍 Timezone: Script uses Europe/Istanbul (auto DST handling)"
          echo "📰 Filtering: Recent articles (last 3 days)"
          echo "💾 Storage: Supabase PostgreSQL"
          echo "🔄 Firecrawl Cache: maxAge=2h (fresh data for scheduled runs)"
          echo ""
          echo "🤖 AI Models (ALL PRODUCTION - STABLE):"
          echo "   Primary: llama-3.1-8b-instant (560 T/s, 250K TPM)"
          echo "   Fallback: openai/gpt-oss-20b (1000 T/s, 250K TPM) ⚡"
          echo "   Last Resort: llama-3.3-70b-versatile (280 T/s, 300K TPM)"
          echo "   Parser: llama-3.1-8b-instant (article list extraction)"
          echo "   ⚠️ Preview models (llama-4, qwen3) NOT used for stability"
          echo ""
          echo "⚡ Rate Limiting:"
          echo "   Translation delay: 1000ms between requests"
          echo "   Firecrawl delay: 10000ms (10s) between articles"
          echo "   Firecrawl waitFor: 4500ms (embed JS rendering)"
          echo "   Max retries: 2 per model (with simplified prompt)"
          echo ""
          echo "✅ Quality Controls (Learned from experience):"
          echo "   ✓ Date validation (year <= current, no future dates)"
          echo "   ✓ Turkish character detection in translations"
          echo "   ✓ CJK (Chinese/Japanese/Korean) character detection"
          echo "   ✓ Non-Latin character detection (Arabic/Cyrillic)"
          echo "   ✓ Latin ratio check (>80% English)"
          echo "   ✓ Instruction leakage detection (prompt text in output)"
          echo "   ✓ Title cleaning (removes NuvemMag branding)"
          echo "   ✓ YouTube garbage text removal (pattern-based skip)"
          echo "   ✓ Twitter widget text removal"
          echo "   ✓ Content quality checks with auto-fix"
          echo "   ✓ Duplicate detection (slug + same-run tracking)"
          echo ""
          echo "🎬 Embed System:"
          echo "   ✓ YouTube: [[EMBED:YOUTUBE:VIDEO_ID]]"
          echo "   ✓ Twitter: [[EMBED:TWEET:TWEET_ID]]"
          echo "   ✓ TikTok: [[EMBED:TIKTOK:URL]]"
          echo "   ✓ Tokens protected during translation (placeholder swap)"
          echo "   ✓ Post-translation token validation + auto re-inject"
          echo "   ✓ Inline URL detection (not just start-of-line)"
          echo ""
          npm run scrape:news
      
      - name: ✅ Success summary
        if: success()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "🎉 TECH NEWS SCRAPER - BAŞARILI"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "✅ İşlem başarıyla tamamlandı!"
          echo "📊 Haberler Supabase PostgreSQL veritabanına kaydedildi"
          echo "⏰ Tamamlanma zamanı: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "🔍 Yapılan Kontroller:"
          echo "   ✓ Tarih validasyonu (yıl <= mevcut, gelecek tarih yok)"
          echo "   ✓ Türkçe karakter kontrolü"
          echo "   ✓ Çince/Japonca/Korece karakter kontrolü"
          echo "   ✓ Non-Latin karakter kontrolü (Arapça/Kiril)"
          echo "   ✓ Instruction leakage tespiti"
          echo "   ✓ NuvemMag branding temizleme (auto-fix)"
          echo "   ✓ YouTube garbage text temizleme (pattern-based)"
          echo "   ✓ Embed token koruma (placeholder swap + doğrulama)"
          echo "   ✓ Inline URL tespiti (Twitter/TikTok mid-paragraph)"
          echo "   ✓ İçerik kalite kontrolü"
          echo "   ✓ Duplicate kontrolü (slug + same-run)"
          echo ""
          echo "💾 Depolama: Supabase PostgreSQL"
          echo "🔄 Website otomatik olarak veritabanından güncel verileri çekecek"
          echo ""
          echo "═══════════════════════════════════════════════════════════"
      
      - name: 📱 Send success notification to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_SUCCESS: 'true'
        run: |
          if [ "$NOTIFY_SUCCESS" = "true" ]; then
            CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
            MESSAGE="✅ <b>TECH NEWS SCRAPER - BAŞARILI</b>%0A%0A🎉 Haber toplama işlemi başarıyla tamamlandı!%0A⏰ Zaman: ${CURRENT_TIME}%0A💾 Veritabanı: Supabase PostgreSQL%0A🔄 Durum: Aktif%0A%0A<i>Tüm sistemler normal çalışıyor</i>"
            
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true" > /dev/null
            
            echo "📱 Telegram bildirim gönderildi"
          else
            echo "📱 Başarı bildirimi devre dışı (sadece hata bildirimleri aktif)"
          fi
      
      - name: 📧 Send notification on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "❌ TECH NEWS SCRAPER - HATA!"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "❌ Haber toplama işlemi başarısız oldu"
          CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          echo "⏰ Zaman: ${CURRENT_TIME}"
          echo "🔧 Workflow: Scrape Tech News"
          echo "📊 Durum: Başarısız"
          echo ""
          echo "🔍 Olası Sorunlar:"
          echo "   • API anahtarı hatası (Firecrawl/Groq)"
          echo "   • Veritabanı bağlantı sorunu (Supabase)"
          echo "   • Rate limit aşımı (Groq/Firecrawl)"
          echo "   • Kaynak site erişim sorunu (nuvemmag.com)"
          echo "   • Tarih parsing hatası (gelecek tarih)"
          echo "   • Çeviri kalite kontrolü başarısız (Türkçe/CJK chars)"
          echo "   • Instruction leakage tespit edildi"
          echo ""
          echo "🔗 Log kayıtları: ${LOG_URL}"
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          
          MESSAGE="🚨 <b>TECH NEWS SCRAPER - HATA!</b>%0A%0A❌ Haber toplama işlemi başarısız oldu%0A⏰ Zaman: ${CURRENT_TIME}%0A🔧 Workflow: Scrape Tech News%0A📊 Durum: Başarısız%0A%0A🔍 <b>Olası Sorunlar:</b>%0A• API anahtarı hatası (Firecrawl/Groq)%0A• Veritabanı bağlantı sorunu (Supabase)%0A• Rate limit aşımı (Groq/Firecrawl)%0A• Kaynak site erişim sorunu%0A• Tarih/Çeviri kalite kontrolü%0A%0A🔗 <a href='${LOG_URL}'>Log kayıtlarını incele</a>%0A%0A<i>⚠️ Sistem otomatik olarak tekrar deneyecek</i>"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" > /dev/null
          
          echo "📱 Hata bildirimi Telegram'a gönderildi"
