name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail workflow if vulnerabilities found

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        continue-on-error: true
        run: |
          echo "🔍 Running NPM security audit..."
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          echo "📊 Audit results:"
          npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found - review the report"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true  # Don't block PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high  # Only fail on high/critical
          allow-licenses: MIT, Apache-2.0, BSD-3-Clause, ISC, BSD-2-Clause

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent indefinite hanging
    continue-on-error: true  # Don't fail workflow
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail on false positives

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml
        continue-on-error: true  # Don't fail on doc examples

      - name: Gitleaks Summary
        if: always()
        run: |
          echo "🔍 Gitleaks scan completed"
          echo "ℹ️  Note: Documentation examples are ignored via .gitleaks.toml"
          echo "⚠️  If secrets found, review gitleaks-report.json artifact"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, secret-scan, codeql-analysis]
    if: always()

    steps:
      - name: Security scan completed
        run: |
          echo "✅ Security scans completed!"
          echo ""
          echo "📊 Scan Results Summary:"
          echo "========================"
          echo ""
          echo "✓ NPM Audit: ${{ needs.npm-audit.result }}"
          echo "✓ Secret Scan: ${{ needs.secret-scan.result }}"
          echo "✓ CodeQL: ${{ needs.codeql-analysis.result }}"
          echo ""
          echo "🔒 Security Recommendations:"
          echo "  - Review npm audit findings in artifacts"
          echo "  - Check for any detected secrets (excluding docs)"
          echo "  - Update dependencies regularly"
          echo "  - Review CodeQL findings in Security tab"
          echo ""
          echo "ℹ️  Note: Jobs are marked as continue-on-error to avoid"
          echo "    blocking deployments on minor findings. Review all"
          echo "    results and address critical issues."
