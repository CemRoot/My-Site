name: System Health Check

# Daily health check - runs once per day
on:
  schedule:
    # Run at 08:00 UTC every day (before first scraping)
    - cron: '0 8 * * *'
  
  # Manual trigger
  workflow_dispatch:

# Prevent multiple runs
concurrency:
  group: system-health-check
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏥 Run system health check
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # APIs
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          
          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "🏥 Running comprehensive system health check..."
          echo "📅 Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🔍 Checking all system components..."
          echo ""
          npm run health:check
      
      - name: ✅ Health check passed
        if: success()
        run: |
          echo "✅ All systems healthy!"
          echo "📊 Health report sent to Telegram"
          echo "⏰ Completed at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      
      - name: ❌ Health check failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "❌ System health check failed!"
          CURRENT_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          MESSAGE="🚨 <b>SİSTEM SAĞLIK KONTROLÜ - KRİTİK HATA</b>%0A%0A❌ Sistem sağlık kontrolü başarısız oldu%0A⏰ Zaman: ${CURRENT_TIME}%0A%0A🔍 <b>Kritik Sistem Hatası Tespit Edildi</b>%0AEn az bir sistem bileşeni düzgün çalışmıyor.%0A%0A📊 <b>Kontrol Edilmesi Gerekenler:</b>%0A• Supabase bağlantısı%0A• Firecrawl API durumu%0A• Groq AI API durumu%0A• Telegram Bot durumu%0A%0A🔗 <a href='${LOG_URL}'>Detaylı log kayıtlarını incele</a>%0A%0A<i>⚠️ Acil müdahale gerekebilir!</i>"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=false" > /dev/null || true
          
          echo "📱 Critical error notification sent to Telegram"
          echo "Check the logs: ${LOG_URL}"

