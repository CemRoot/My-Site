name: Telegram Bot Setup

# Run when manually triggered or after deployment
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'setup-menu'
        type: choice
        options:
          - setup-menu
          - send-welcome
          - test-connection
  
  # Auto-run after successful deployment
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed

# Allow concurrent runs
concurrency:
  group: telegram-setup-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup-telegram-bot:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🤖 Setup Telegram Bot Menu
        if: github.event.inputs.action == 'setup-menu' || github.event_name != 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "🤖 Setting up Telegram bot menu..."
          npm run telegram:setup-menu
      
      - name: 📱 Send Test Message
        if: github.event.inputs.action == 'test-connection'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "📱 Testing Telegram connection..."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ GitHub Actions test successful! Bot is connected." \
            -d "parse_mode=HTML"
      
      - name: ✅ Setup Complete
        run: |
          echo "🎉 Telegram bot setup completed successfully!"
          echo "📱 Bot commands are now available in Telegram"
          echo "🔔 Menu has been sent to your chat"

