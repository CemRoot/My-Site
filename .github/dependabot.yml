# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot
#
# Pairs with .github/workflows/dependabot-auto-merge.yml: patch/minor PRs are
# auto-merged once the "Build & Audit" check passes; major bumps wait for review.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Dublin"
    open-pull-requests-limit: 10
    assignees:
      - "CemRoot"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # All security fixes that are not major bumps land in a single PR.
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "@types/*"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
