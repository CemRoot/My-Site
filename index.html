    <!--
      No preconnects.

      wsrv.nl was here for the image CDN (src/lib/utils/imageProxy.ts), but
      index.html is served for EVERY route by the catch-all rewrite in
      vercel.json, and only /tech-news requests images. Lighthouse flagged it as
      an unused preconnect on the home page, which is the page being scored — an
      idle connection held open for a host that route never calls. /tech-news now
      pays its own handshake, on demand, where it is actually useful.

      fonts.googleapis.com and vercel.live went earlier: fonts are self-hosted
      through @fontsource and nothing on the site requests either host.

      If a preconnect ever comes back here: NO `crossorigin` for wsrv.nl. Those
      <img> tags carry no crossOrigin attribute, so they fetch in no-cors mode
      and cannot reuse a CORS-mode connection.
    -->

    <!--
      Critical first-paint styles. The real @font-face set is self-hosted via
      @fontsource (see src/fonts.css); this only paints the correct ground
      colour and font stack before the CSS bundle lands, so there is no
      light-flash and no fallback-font reflow.

      NOTE: these rules are UNLAYERED, so they beat anything in `@layer base`.
      Keep the font stack in sync with --font-sans in src/styles/globals.css.
    -->
    <style>
      html,
      body {
        background: #0a0a0b;
        color: #ededea;
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>

    <!-- Preconnect to Sentry deferred — not on critical rendering path -->
